name: Build Windows release
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test using synthetic data only
        run: python -m unittest discover -s tests -v
      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/')
        shell: python
        run: |
          import os
          from app_updates import VERSION
          assert os.environ['GITHUB_REF_NAME'] == 'v' + VERSION
      - name: Build executable
        run: |
          python -m pip install pyinstaller==6.22.0
          python -m PyInstaller --clean --noconfirm ExamAccessLogGenerator.spec
      - name: Test packaged Windows updater
        run: python tests/smoke_windows.py
      - uses: actions/upload-artifact@v4
        with:
          name: ExamAccessLogGenerator-Windows
          path: dist/ExamAccessLogGenerator.exe
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:GITHUB_REF_NAME dist/ExamAccessLogGenerator.exe --verify-tag --generate-notes --title "StudentSort $env:GITHUB_REF_NAME"
